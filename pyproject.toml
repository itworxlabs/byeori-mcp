# MCP 서버 — 벼리를 HTTP 로 부르는 별도 프로그램이다.
# 벼리 백엔드와 의존성을 공유하지 않는다 — 공유하면 벼리 내부를 import 할 수 있게 된다.
[project]
name = "byeori-mcp"
version = "0.1.0"
description = "벼리의 KB 를 LLM 이 찾아 쓰게 하는 MCP 서버"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    # HTTP 클라이언트는 httpx2 하나만 쓴다
    "httpx2==2.16.0",
]

[project.scripts]
byeori-mcp = "byeori_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=2.4",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/byeori_mcp"]
